[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
description = "Local-first multi-role job search agent with LM Studio and Postgres"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "openai>=1.68,<2",
  "anthropic>=0.49,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.0,<6",
  "jobspy>=0.6,<1",
  "duckduckgo-search>=8.0,<9",
  "click>=8.1,<9",
  "rich>=13.0,<14",
]

[project.scripts]
job-agent = "job_agent.cli:cli"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["job_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"
