<tr id="email-preview-{{ draft.target_id }}" class="bg-slate-50">
  <td colspan="7" class="px-6 py-4">
    <div class="text-xs text-slate-500 mb-1 font-semibold uppercase tracking-wide">Subject</div>
    <div class="text-sm font-medium text-slate-800 mb-3">{{ draft.subject }}</div>
    <div class="text-xs text-slate-500 mb-1 font-semibold uppercase tracking-wide">Body</div>
    <pre class="text-sm text-slate-700 whitespace-pre-wrap font-sans">{{ draft.body_text }}</pre>
    <div class="mt-3 text-xs text-slate-400">
      Draft {{ draft.id }} - created {{ draft.created_at.strftime('%d %b %Y %H:%M') }}
    </div>
  </td>
</tr>
