<tr class="border-t border-gray-50 hover:bg-gray-50" id="job-row-{{ job.id }}">
  <td class="px-4 py-2 font-medium">
    {% if job.company_url %}
      <a href="{{ job.company_url }}" target="_blank" class="hover:text-indigo-600">{{ job.company }}</a>
    {% else %}
      {{ job.company }}
    {% endif %}
  </td>
  <td class="px-4 py-2 text-slate-600">
    {% if job.source_url %}
      <a href="{{ job.source_url }}" target="_blank" class="hover:text-indigo-600">{{ job.title }}</a>
    {% else %}
      {{ job.title }}
    {% endif %}
  </td>
  <td class="px-4 py-2">
    {% set score = job.best_score or 0 %}
    <span class="px-2 py-0.5 rounded text-xs font-semibold {% if score >= 75 %}bg-green-100 text-green-700{% elif score >= 50 %}bg-yellow-100 text-yellow-700{% else %}bg-red-100 text-red-600{% endif %}">
      {{ score }}%
    </span>
  </td>
  <td class="px-4 py-2 text-slate-500 text-xs">{{ job.best_track or "-" }}</td>
  <td class="px-4 py-2">
    <span class="px-2 py-0.5 rounded-full text-xs {% if job.status == 'new' %}bg-blue-100 text-blue-700{% elif job.status == 'applied' %}bg-green-100 text-green-700{% elif job.status == 'reviewed' %}bg-yellow-100 text-yellow-700{% else %}bg-gray-100 text-gray-600{% endif %}">
      {{ job.status }}
    </span>
  </td>
  <td class="px-4 py-2 flex gap-2">
    <button
      hx-post="/ui/jobs/{{ job.id }}/queue-cv?resume_track_slug={{ job.best_track_slug or 'data-engineering-analytics' }}"
      hx-swap="none"
      class="px-2 py-1 text-xs bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200"
    >
      Queue CV
    </button>
    <button
      hx-post="/ui/jobs/{{ job.id }}/enrich-row"
      hx-target="#job-row-{{ job.id }}"
      hx-swap="outerHTML"
      class="px-2 py-1 text-xs bg-gray-100 text-gray-600 rounded hover:bg-gray-200"
    >
      Enrich
    </button>
  </td>
</tr>
