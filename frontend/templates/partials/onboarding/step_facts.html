<section class="app-panel setup-step hidden" data-step="2">
  <div class="app-panel__body space-y-5">
    <div>
      <h2 class="text-xl font-semibold text-slate-900">Build your fact sheet</h2>
      <p class="mt-1 text-sm text-slate-500">
        Upload one or more CV files (PDF or text) and let Job Agent extract your profile automatically.
        Manual notes are optional for recent updates not in those files.
      </p>
    </div>
    <input id="source-files" type="file" multiple accept=".pdf,.txt,.md,.rst,application/pdf,text/plain,text/markdown" class="block w-full rounded-xl border border-slate-200 bg-white p-3 text-sm">
    <label class="block text-sm">
      <span class="mb-1 block font-medium text-slate-700">Optional manual notes (only if needed)</span>
      <textarea id="profile-notes" rows="7" class="w-full rounded-xl border border-slate-300 px-3 py-2" placeholder="Recent roles, tools, projects, education, languages, achievements..."></textarea>
    </label>
    <div id="intake-skeleton" class="hidden space-y-3" aria-busy="true" aria-label="Loading profile analysis…">
      <div class="h-5 w-48 rounded-lg bg-slate-100 animate-pulse" aria-hidden="true"></div>
      <div class="h-4 w-full rounded-lg bg-slate-100 animate-pulse" aria-hidden="true"></div>
      <div class="h-4 w-3/4 rounded-lg bg-slate-100 animate-pulse" aria-hidden="true"></div>
      <div class="h-4 w-full rounded-lg bg-slate-100 animate-pulse" aria-hidden="true"></div>
      <div class="h-4 w-2/3 rounded-lg bg-slate-100 animate-pulse" aria-hidden="true"></div>
    </div>
    <p id="facts-status" class="text-sm text-slate-500"></p>
    <div class="flex items-center gap-3">
      <button type="button" onclick="goToStep(1)" class="app-button app-button--ghost">Back</button>
      <button id="run-intake-button" type="button" onclick="runIntake()" class="app-button app-button--primary">Analyse my profile</button>
    </div>
  </div>
</section>
