<tbody id="job-group-{{ job.id }}" data-job-group="{{ job.id }}" x-data="{ snapLoaded: false, readyLoaded: false, pkgLoaded: false }">
  {% include "partials/job_row.html" %}
  <tr id="package-check-row-{{ job.id }}" class="hidden border-t border-indigo-100 bg-indigo-50/30">
    <td colspan="7" class="px-5 py-4">
      <div id="package-check-{{ job.id }}" class="flex items-center gap-2">
        <span class="htmx-indicator w-4 h-4 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></span>
        <p class="text-xs text-slate-500 font-medium">Loading application snapshot…</p>
      </div>
    </td>
  </tr>
  <tr id="snapshot-row-{{ job.id }}" class="hidden border-t border-sky-100 bg-sky-50/30">
    <td colspan="7" class="px-5 py-4">
      <div id="snapshot-{{ job.id }}">
        <p class="text-xs text-slate-400">Loading opportunity snapshot…</p>
      </div>
    </td>
  </tr>
  <tr id="fit-gap-row-{{ job.id }}" class="hidden border-t border-orange-100 bg-orange-50/30">
    <td colspan="7" class="px-5 py-4">
      <section class="rounded-xl border border-orange-100 bg-white p-5 shadow-sm">
        <div class="mb-3 flex flex-wrap items-start justify-between gap-3">
          <div>
            <h3 class="text-base font-semibold text-slate-800">Role Readiness Map</h3>
            <p class="mt-1 text-xs text-slate-500">
              Compares this job description with your fact sheet before generating a CV.
            </p>
          </div>
        </div>
        <div id="fit-gaps-{{ job.id }}">
          <p class="animate-pulse text-xs text-slate-400">Analysing role fit…</p>
        </div>
      </section>
    </td>
  </tr>
</tbody>
