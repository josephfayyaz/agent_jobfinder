services:
  db:
    image: postgres:17
    container_name: local-llm-db
    environment:
      POSTGRES_DB: job_agent
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: job_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_agent -d job_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: local-llm-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  worker:
    build: .
    container_name: local-llm-worker
    command: ["python", "-m", "job_agent.worker"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app

volumes:
  postgres_data:
