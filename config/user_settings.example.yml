# Job Agent — User Settings
# The live user settings file is stored in your local Job Agent data home,
# outside the repo, so sharing the project folder does not leak your data.
# Do NOT put APP_ENV here — that stays in .env.

# ── Database ──────────────────────────────────────────────────────────────────
# Default: SQLite file in your local Job Agent data home (no Docker needed).
# Override only if you know what you are doing:
# database_url: "sqlite:////absolute/path/to/custom.db"

# ── LLM Provider ──────────────────────────────────────────────────────────────
llm_provider_mode: "openai"       # openai | gemini | anthropic | lm_studio | ollama
lm_studio_base_url: "http://localhost:1234/v1"
lm_studio_small_model: ""      # fast model for scoring / routing
lm_studio_writer_model: ""     # high-quality model for CV drafts
lm_studio_mid_model: ""        # mid model for extraction (leave blank = use small)

# Cloud providers — leave blank to disable
openai_api_key: ""
gemini_api_key: ""
anthropic_api_key: ""
use_openai_review: false
use_claude_final_review: false

# ── Gmail OAuth (optional) ───────────────────────────────────────────────────
gmail_oauth_client_id: ""
gmail_oauth_client_secret: ""
gmail_label_filter: "LinkedIn Jobs"
gmail_auto_sync: false

# ── Job Discovery ─────────────────────────────────────────────────────────────
target_job_seniority: "junior"     # intern | junior | mid | senior | any
fact_sheet_path: ""                # optional local path for first-run ingestion
match_min_score: 75
discovery_min_fit_score: 70
discovery_max_visible_jobs: 40
use_jobspy: false
jobspy_discover_location: "Italy"
# Release scope: exactly one selected country.
job_search_countries:
  - "Italy"
job_search_region: ""
job_search_languages:
  - name: "English"
    level: "professional"
jobspy_discover_queries:
  - "Target Role 1"
  - "Target Role 2"

# ── Output ────────────────────────────────────────────────────────────────────
# Folder where generated CVs and cover letters are saved.
# Default: "generated" (inside your local Job Agent data home).
# Example: "~/Documents/JobApplications"
artifacts_dir: "generated"

# ── CV Thresholds ─────────────────────────────────────────────────────────────
cv_pass_score: 85
cv_revise_score: 60
bullet_clarify_word_limit: 22
